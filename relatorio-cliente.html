<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório do Cliente - Equilibrium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f4f1f8; display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: linear-gradient(180deg, #4b0082, #6a0dad); color: #ffd700; padding: 20px; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,215,0,0.3); padding-bottom: 10px; }
        .sidebar a { display: block; color: #fff; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 8px; transition: .3s; font-size: 14px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(255,215,0,0.2); color: #ffd700; font-weight: bold; }
        .main { margin-left: 250px; padding: 30px; flex: 1; }
        .header { margin-bottom: 25px; }
        .header h1 { color: #4b0082; font-size: 26px; }
        .header .subtitle { color: #666; font-size: 14px; margin-top: 5px; }
        .card { background: #fff; border-radius: 10px; padding: 25px; box-shadow: 0 2px 8px rgba(75,0,130,0.08); margin-bottom: 20px; }
        .search-group { position: relative; }
        #clienteBusca { width: 100%; padding: 14px; border: 2px solid #e0d4f0; border-radius: 8px; font-size: 16px; outline: none; }
        #clienteBusca:focus { border-color: #6a0dad; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ddd; border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; }
        .autocomplete-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .autocomplete-item:hover { background: #f7f2fc; color: #4b0082; }
        #contador { margin-top: 8px; font-size: 13px; color: #4b0082; font-weight: bold; display: none; }
        #msgErro { display: none; padding: 12px; background: #fde8e8; color: #c0392b; border-radius: 6px; margin-top: 10px; font-size: 14px; }
        #relatorioContainer { display: none; }
        .document-page { background: #fff; padding: 50px; border-radius: 4px; box-shadow: 0 0 15px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto; }
        .doc-header { text-align: center; border-bottom: 2px solid #4b0082; padding-bottom: 20px; margin-bottom: 30px; }
        .doc-section { margin-bottom: 25px; }
        .doc-section h3 { background: #f8f9fa; padding: 8px 15px; color: #4b0082; font-size: 16px; border-left: 4px solid #4b0082; margin-bottom: 15px; text-transform: uppercase; }
        .data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 20px; }
        .data-item { font-size: 14px; border-bottom: 1px solid #f0f0f0; padding: 5px 0; }
        .data-label { font-weight: 700; color: #555; margin-right: 8px; }
        .sub-card { border: 1px solid #eee; padding: 15px; margin-bottom: 12px; border-radius: 6px; }
        .action-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; display: none; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-print { background: #4b0082; color: #fff; }
        .btn-refresh { background: #6c757d; color: #fff; }
        .btn:hover { opacity: .9; }
        @media print {
            .sidebar, .card, .action-buttons, .header { display: none !important; }
            .main { margin-left: 0; padding: 0; }
            body { background: #fff; }
            .document-page { box-shadow: none; padding: 20px; max-width: 100%; }
        }
    </style>
</head>
